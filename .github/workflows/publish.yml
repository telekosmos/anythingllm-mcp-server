name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check version is not already published
        id: check
        run: |
          VERSION="$(npm pkg get version | tr -d '"')"
          if npm view "@telekosmos/anythingllm-mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} is already published - skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} is new - will publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.published == 'false'
        run: npm test

      - name: Build package (verify tarball contents)
        if: steps.check.outputs.published == 'false'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
