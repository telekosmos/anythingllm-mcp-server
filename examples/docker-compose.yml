# Multi-container example: AnythingLLM + this MCP server + an MCP client.
#
#   anythingllm          - AnythingLLM API server
#   anythingllm-mcp      - this MCP server (SSE transport over HTTP)
#   hermes               - the MCP client (fill in your own image/config)
#
# The MCP server reaches AnythingLLM over the compose network at
# http://anythingllm:3001 and exposes its SSE endpoint at
# http://anythingllm-mcp:4001/sse.
#
#   Streamable HTTP alternative: set MCP_TRANSPORT=streamable-http and point the
#   client at http://anythingllm-mcp:4001/mcp instead of /sse.
#
# Replace every <placeholder> below with a real value before starting:
#   - Generate JWT_SECRET and SIG_KEY with: openssl rand -hex 32
#   - ANYTHINGLLM_API_KEY is not something the environment provides. Enable
#     the Developer API in the AnythingLLM UI (Settings -> API Keys), generate
#     a key, and paste it in place of <your-anythingllm-api-key>. Without it
#     every MCP tool call returns a 401 even though the stack looks healthy.
#
# Usage:
#   docker compose -f examples/docker-compose.yml up

name: anythingllm-mcp-server-test

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    ports:
      - "30011:3001"
    environment:
      - JWT_SECRET=<generate-a-long-random-secret>
      - SIG_KEY=<generate-a-long-random-secret>
      - STORAGE_DIR=/app/server/storage
    volumes:
      - anythingllm-data:/app/server/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

  anythingllm-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: anythingllm-mcp-server:latest
    ports:
      - "4001:4001"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=4001
      - ANYTHINGLLM_BASE_URL=http://anythingllm:3001
      - ANYTHINGLLM_API_KEY=<your-anythingllm-api-key>
    depends_on:
      anythingllm:
        condition: service_healthy

  hermes:
    image: <your-hermes-image>
    environment:
      # Point the client at the MCP server's SSE endpoint:
      - MCP_URL=http://anythingllm-mcp:4001/sse
    depends_on:
      - anythingllm-mcp

volumes:
  anythingllm-data:
